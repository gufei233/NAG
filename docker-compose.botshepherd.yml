services:
  botshepherd:
    image: ${BOTSHEPHERD_IMAGE:-ghcr.io/gufei233/botshepherd:v1.2.1-docker.1}
    container_name: nag-botshepherd
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BS_SUPERUSERS: ${NAPCAT_MASTER_QQ:?Set NAPCAT_MASTER_QQ (installer writes it to .installer/*.env)}
      BS_WEB_USERNAME: ${BOTSHEPHERD_WEB_USERNAME:-admin}
      BS_WEB_PASSWORD: ${BOTSHEPHERD_WEB_PASSWORD:-}
      BS_WEB_PORT: "5111"
      BS_CLIENT_ENDPOINT: ws://0.0.0.0:2537/OneBotv11
      BS_TARGET_ENDPOINTS: ws://astrbot:6199/ws
    ports:
      - "${BIND_IP:-127.0.0.1}:${BOTSHEPHERD_WEBUI_PORT:-5111}:5111"
    expose:
      - "2537"
    volumes:
      - ${DATA_ROOT:-/opt/nag-data}/botshepherd/config:/app/config
      - ${DATA_ROOT:-/opt/nag-data}/botshepherd/data:/app/data
      - ${DATA_ROOT:-/opt/nag-data}/botshepherd/logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - astrbot
    networks:
      - nag-net

  napcat:
    depends_on:
      - astrbot
      - botshepherd

  astrbot-onebot-init:
    environment:
      NAPCAT_ONEBOT_WS_URL: ws://botshepherd:2537/OneBotv11
      NAPCAT_ONEBOT_WS_NAME: BotShepherd
