name: nag

x-common-env: &common-env
  TZ: ${TZ:-Asia/Shanghai}

services:
  gscore:
    image: ${GSCORE_IMAGE:-docker.cnb.cool/gscore-mirror/gsuid_core:latest}
    container_name: nag-gscore
    restart: unless-stopped
    environment:
      <<: *common-env
      PYTHONUNBUFFERED: "1"
      UV_INDEX: ${GSCORE_PYTHON_INDEX:-https://pypi.org/simple/}
      UV_NO_CONFIG: ${UV_NO_CONFIG:-0}
      PLAYWRIGHT_BROWSERS_PATH: ${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}
      PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
      http_proxy: ${GSCORE_HTTP_PROXY:-}
      https_proxy: ${GSCORE_HTTPS_PROXY:-}
      no_proxy: ${GSCORE_NO_PROXY:-localhost,127.0.0.1,gscore,astrbot,napcat,.local,cnb.cool,mirrors.aliyun.com,pypi.tuna.tsinghua.edu.cn,mirrors.volces.com}
    ports:
      - "${BIND_IP:-127.0.0.1}:${GSCORE_PORT:-8765}:8765"
    volumes:
      - ${DATA_ROOT:-/opt/nag-data}/gscore/data:/gsuid_core/data
      - ${DATA_ROOT:-/opt/nag-data}/gscore/plugins:/gsuid_core/gsuid_core/plugins
      - gscore-venv:/venv
      - gscore-playwright:/ms-playwright
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nag-net

  astrbot:
    image: ${ASTRBOT_IMAGE:-soulter/astrbot:latest}
    container_name: nag-astrbot
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "${BIND_IP:-127.0.0.1}:${ASTRBOT_WEBUI_PORT:-6185}:6185"
    expose:
      - "6199"
    volumes:
      - ${DATA_ROOT:-/opt/nag-data}/astrbot:/AstrBot/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - gscore
    networks:
      - nag-net

  napcat:
    image: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker:latest}
    container_name: nag-napcat
    restart: unless-stopped
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
      ACCOUNT: ${NAPCAT_ACCOUNT:-}
      MODE: astrbot
    ports:
      - "${BIND_IP:-127.0.0.1}:${NAPCAT_WEBUI_PORT:-6099}:6099"
    volumes:
      - ${DATA_ROOT:-/opt/nag-data}/astrbot:/AstrBot/data
      - ${DATA_ROOT:-/opt/nag-data}/napcat/config:/app/napcat/config
      - ${DATA_ROOT:-/opt/nag-data}/napcat/qq:/app/.config/QQ
    depends_on:
      - astrbot
    networks:
      - nag-net

  astrbot-plugin-init:
    image: ${ALPINE_GIT_IMAGE:-alpine/git:latest}
    container_name: nag-astrbot-plugin-init
    profiles:
      - init
    environment:
      GSCORE_WS_TOKEN: ${GSCORE_WS_TOKEN:-}
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -eu
        mkdir -p /AstrBot/data/plugins

        clone_or_update() {
          repo="$$1"
          dir="$$2"
          target="/AstrBot/data/plugins/$$dir"

          if [ -d "$$target/.git" ]; then
            git -C "$$target" pull --ff-only
          elif [ -e "$$target" ]; then
            echo "Skip $$target: exists but is not a git repo"
          else
            git clone --depth=1 "$$repo" "$$target"
          fi
        }

        clone_or_update ${ASTRBOT_GSCORE_ADAPTER_REPO:-https://github.com/KimigaiiWuyi/astrbot_plugin_gscore_adapter.git} astrbot_plugin_gscore_adapter

        config=/AstrBot/data/config/astrbot_plugin_gscore_adapter_config.json
        if [ ! -e "$$config" ]; then
          mkdir -p /AstrBot/data/config
          cat >"$$config" <<EOF
        {
          "IP": "gscore",
          "PORT": "8765",
          "BOT_ID": "AstrBot",
          "WS_TOKEN": "$$GSCORE_WS_TOKEN",
          "GSCORE_ONLY_PREFIXES": [],
          "MAX_RETRY_TIMES": 30
        }
        EOF
          echo "Created AstrBot GScore adapter config for gscore:8765."
        elif [ -s "$$config" ] && [ -n "$$GSCORE_WS_TOKEN" ]; then
          apk add --no-cache jq >/dev/null
          if [ "$$(jq -r '.WS_TOKEN // ""' "$$config")" != "$$GSCORE_WS_TOKEN" ]; then
            jq --arg token "$$GSCORE_WS_TOKEN" '.WS_TOKEN = $$token' \
              "$$config" >"$$config.tmp"
            mv "$$config.tmp" "$$config"
            echo "Synced the AstrBot GScore adapter WS_TOKEN with the shared token."
          fi
        fi
    volumes:
      - ${DATA_ROOT:-/opt/nag-data}/astrbot:/AstrBot/data
    networks:
      - nag-net

  astrbot-onebot-init:
    image: ${GSCORE_IMAGE:-docker.cnb.cool/gscore-mirror/gsuid_core:latest}
    container_name: nag-astrbot-onebot-init
    profiles:
      - init
    environment:
      NAPCAT_MASTER_QQ: ${NAPCAT_MASTER_QQ:-}
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
      NAPCAT_ONEBOT_WS_URL: ${NAPCAT_ONEBOT_WS_URL:-ws://astrbot:6199/ws}
      NAPCAT_ONEBOT_WS_NAME: ${NAPCAT_ONEBOT_WS_NAME:-AstrBot}
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -eu
        /venv/bin/python - <<'PY'
        import json
        import os
        from pathlib import Path

        admins_id = list(
            dict.fromkeys(
                account.strip()
                for account in os.environ["NAPCAT_MASTER_QQ"].split(",")
                if account.strip()
            )
        )
        onebot_ws_url = os.environ["NAPCAT_ONEBOT_WS_URL"]
        onebot_ws_name = os.environ["NAPCAT_ONEBOT_WS_NAME"]

        def load_json(path):
            return json.loads(path.read_text(encoding="utf-8-sig"))

        def write_json(path, value, uid=None, gid=None):
            temporary = path.with_name(path.name + ".tmp")
            temporary.write_text(
                json.dumps(value, ensure_ascii=False, indent=2) + "\n",
                encoding="utf-8",
            )
            temporary.chmod(0o600)
            if uid is not None and gid is not None:
                os.chown(temporary, uid, gid)
            temporary.replace(path)

        astrbot_path = Path("/AstrBot/data/cmd_config.json")
        if not astrbot_path.is_file():
            raise SystemExit(f"Missing {astrbot_path}; start AstrBot once before running this initializer.")

        astrbot_config = load_json(astrbot_path)
        if admins_id:
            astrbot_config["admins_id"] = admins_id
        platforms = astrbot_config.setdefault("platform", [])
        platform = next(
            (item for item in platforms if item.get("id") == "napcat"),
            None,
        )
        if platform is None:
            platform = next(
                (item for item in platforms if item.get("type") == "aiocqhttp"),
                None,
            )
        if platform is None:
            platform = {"id": "napcat"}
            platforms.append(platform)
        platform.update(
            {
                "type": "aiocqhttp",
                "enable": True,
                "ws_reverse_host": "0.0.0.0",
                "ws_reverse_port": 6199,
                "ws_reverse_token": "",
            }
        )
        write_json(astrbot_path, astrbot_config)

        napcat_dir = Path("/NapCat/config")
        napcat_paths = sorted(napcat_dir.glob("onebot11*.json"))
        if not napcat_paths:
            napcat_paths = [napcat_dir / "onebot11.json"]
            napcat_paths[0].parent.mkdir(parents=True, exist_ok=True)
            napcat_paths[0].write_text(
                '{"network":{"httpServers":[],"httpSseServers":[],"httpClients":[],"websocketServers":[],"websocketClients":[],"plugins":[]}}\n',
                encoding="utf-8",
            )

        uid = int(os.environ["NAPCAT_UID"])
        gid = int(os.environ["NAPCAT_GID"])
        for napcat_path in napcat_paths:
            napcat_config = load_json(napcat_path)
            network = napcat_config.setdefault("network", {})
            clients = network.setdefault("websocketClients", [])
            client = next(
                (
                    item
                    for item in clients
                    if item.get("url")
                    in {
                      "ws://astrbot:6199/ws",
                      "ws://nonebot:8080/onebot/v11/ws",
                      "ws://botshepherd:2537/OneBotv11",
                      onebot_ws_url,
                    }
                    or item.get("name") in {
                        "rws",
                        "AstrBot",
                        "NoneBot",
                        "BotShepherd",
                        onebot_ws_name,
                    }
                ),
                None,
            )
            if client is None:
                client = {}
                clients.append(client)
            client.update(
                {
                    "enable": True,
                    "name": onebot_ws_name,
                    "url": onebot_ws_url,
                    "reportSelfMessage": False,
                    "messagePostFormat": "array",
                    "token": "",
                    "debug": False,
                    "heartInterval": 30000,
                    "reconnectInterval": 5000,
                }
            )
            write_json(napcat_path, napcat_config, uid, gid)

        print(
            f"Configured {len(admins_id)} AstrBot administrator(s), "
            "OneBot v11 on 0.0.0.0:6199, and "
            f"{len(napcat_paths)} NapCat WebSocket client config(s) "
            f"for {onebot_ws_url}."
        )
        PY
    volumes:
      - ${DATA_ROOT:-/opt/nag-data}/astrbot:/AstrBot/data
      - ${DATA_ROOT:-/opt/nag-data}/napcat/config:/NapCat/config
      - gscore-venv:/venv
    networks:
      - nag-net

  gscore-xwuid-deps-init:
    image: ${GSCORE_IMAGE:-docker.cnb.cool/gscore-mirror/gsuid_core:latest}
    container_name: nag-gscore-xwuid-deps-init
    profiles:
      - init
    environment:
      <<: *common-env
      GSCORE_XWUID_PYTHON_PACKAGES: ${GSCORE_XWUID_PYTHON_PACKAGES:-playwright opencv-python fonttools pypinyin}
      UV_INDEX: ${GSCORE_PYTHON_INDEX:-https://pypi.org/simple/}
      UV_NO_CONFIG: ${UV_NO_CONFIG:-0}
      PLAYWRIGHT_BROWSERS_PATH: ${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}
      PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
      http_proxy: ${GSCORE_HTTP_PROXY:-}
      https_proxy: ${GSCORE_HTTPS_PROXY:-}
      no_proxy: ${GSCORE_NO_PROXY:-localhost,127.0.0.1,gscore,astrbot,napcat,.local,cnb.cool,mirrors.aliyun.com,pypi.tuna.tsinghua.edu.cn,mirrors.volces.com}
    working_dir: /gsuid_core
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -eu
        if [ ! -x /venv/bin/python ]; then
          echo "Missing /venv/bin/python. Start gscore once first: docker compose up -d gscore"
          exit 1
        fi
        uv pip install --python /venv/bin/python $$GSCORE_XWUID_PYTHON_PACKAGES
        if ! uv run --python /venv/bin/python playwright install chromium; then
          if [ -z "$$PLAYWRIGHT_DOWNLOAD_HOST" ]; then exit 1; fi
          echo "Playwright mirror failed; retrying the official download host."
          unset PLAYWRIGHT_DOWNLOAD_HOST
          uv run --python /venv/bin/python playwright install chromium
        fi
    volumes:
      - ${DATA_ROOT:-/opt/nag-data}/gscore/data:/gsuid_core/data
      - ${DATA_ROOT:-/opt/nag-data}/gscore/plugins:/gsuid_core/gsuid_core/plugins
      - gscore-venv:/venv
      - gscore-playwright:/ms-playwright
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nag-net

  gscore-plugin-init:
    image: ${ALPINE_GIT_IMAGE:-alpine/git:latest}
    container_name: nag-gscore-plugin-init
    profiles:
      - init
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -eu
        mkdir -p /plugins

        clone_or_update() {
          repo="$$1"
          dir="$$2"
          target="/plugins/$$dir"

          if [ -d "$$target/.git" ]; then
            git -C "$$target" pull --ff-only
          elif [ -e "$$target" ]; then
            echo "Skip $$target: exists but is not a git repo"
          else
            git clone --depth=1 "$$repo" "$$target"
          fi
        }

        clone_or_update ${XUTHERINGWAVESUID_REPO:-https://github.com/Loping151/XutheringWavesUID.git} XutheringWavesUID
        clone_or_update ${ROVERSIGN_REPO:-https://github.com/Loping151/RoverSign.git} RoverSign
        clone_or_update ${SCOREECHO_REPO:-https://github.com/Loping151/ScoreEcho.git} ScoreEcho
    volumes:
      - ${DATA_ROOT:-/opt/nag-data}/gscore/plugins:/plugins
    networks:
      - nag-net

networks:
  nag-net:
    driver: bridge

volumes:
  gscore-venv:
  gscore-playwright:
