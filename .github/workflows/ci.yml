name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck -f gcc -S warning install.sh scripts/*.sh tests/*.sh

      - name: Bash syntax
        run: |
          for f in install.sh scripts/*.sh tests/*.sh; do
            bash -n "$f"
          done

      - name: Python syntax
        run: python3 -m py_compile scripts/*.py tests/*.py

      - name: YAML syntax
        run: |
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          import glob
          import sys

          import yaml

          failed = []
          for path in sorted(glob.glob("*.yml")) + sorted(glob.glob("NG/*.yml")):
              try:
                  yaml.safe_load(open(path, encoding="utf-8"))
              except Exception as error:  # noqa: BLE001
                  print(f"FAIL {path}: {error}")
                  failed.append(path)
              else:
                  print(f"OK   {path}")
          sys.exit(1 if failed else 0)
          PY

  compose-config:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Compose version
        run: docker compose version

      # 每个 :? 必填项都给一个占位值，让 config 能验证结构而不需要真实凭据。
      - name: Build CI env file
        run: |
          cp .env.example ci.env
          cat >>ci.env <<'EOF'
          GSCORE_WS_TOKEN=citoken0123456789abcdef
          NAPCAT_MASTER_QQ=10001
          NAPCAT_MAC=02:00:00:00:00:01
          QQ_APP_ID=1000000000
          QQ_APP_SECRET=cisecret
          QQ_TOKEN=citoken
          EOF

      # 覆盖 install.sh 里每一种 compose 文件组合，含 BotShepherd 与固定 MAC 叠加。
      - name: Validate every compose combination
        run: |
          set -eu
          root_combos=(
            "docker-compose.yml"
            "docker-compose.yml docker-compose.napcat-adapter.yml"
            "docker-compose.yml docker-compose.botshepherd.yml"
            "docker-compose.nonebot.yml"
            "docker-compose.nonebot.yml docker-compose.napcat-adapter.yml"
            "docker-compose.nonebot.yml docker-compose.botshepherd-nonebot.yml"
            "docker-compose.guided.yml"
            "docker-compose.guided.yml docker-compose.mac.example.yml"
            "docker-compose.qqofficial.yml"
          )
          for combo in "${root_combos[@]}"; do
            args=()
            for file in $combo; do
              args+=(-f "$file")
            done
            echo "::group::compose config -- $combo"
            docker compose --project-directory . --env-file ci.env \
              -p ci "${args[@]}" config --quiet
            echo "::endgroup::"
          done

          echo "::group::compose config -- NG"
          docker compose --project-directory NG --env-file ci.env \
            -p ci-ng -f NG/docker-compose.yml config --quiet
          docker compose --project-directory NG --env-file ci.env \
            -p ci-ng -f NG/docker-compose.yml \
            -f NG/docker-compose.mac.example.yml config --quiet
          echo "::endgroup::"

  dry-run:
    name: Installer dry-run matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require bash 4.4+
        run: bash -c 'echo "$BASH_VERSION"'

      # --dry-run 不碰 Docker、不写任何文件，适合在 CI 里跑满所有预设模式。
      - name: Dry-run every preset mode
        env:
          NAG_INSTALL_STATE_DIR: ${{ github.workspace }}/.ci-installer-state
        run: |
          set -eu
          for mode in astrbot hybrid napcat nonebot nonebot-napcat \
            qqofficial-nonebot qqofficial-direct; do
            echo "::group::dry-run --mode $mode"
            bash install.sh --mode "$mode" --yes --no-cn \
              --master-qq 10001,10002 --bot-qq 3344556677 \
              --no-game-plugins --dry-run
            echo "::endgroup::"
          done

      # dry-run 的核心契约：不产生任何副作用。
      - name: Assert dry-run wrote nothing
        env:
          NAG_INSTALL_STATE_DIR: ${{ github.workspace }}/.ci-installer-state
        run: |
          if [ -d "$NAG_INSTALL_STATE_DIR" ] \
            && [ -n "$(ls -A "$NAG_INSTALL_STATE_DIR")" ]; then
            echo "dry-run leaked state into $NAG_INSTALL_STATE_DIR:" >&2
            ls -la "$NAG_INSTALL_STATE_DIR" >&2
            exit 1
          fi
          echo "dry-run left no state behind"

      - name: Reject invalid input
        run: |
          set -eu
          assert_fails() {
            if bash install.sh "$@" >/dev/null 2>&1; then
              echo "expected failure for: install.sh $*" >&2
              exit 1
            fi
            echo "correctly rejected: install.sh $*"
          }
          assert_fails --mode napcat --yes --no-cn --master-qq abc --dry-run
          assert_fails --mode nosuchmode --yes --no-cn --dry-run
          assert_fails --bogus-flag
          assert_fails --mode uninstall --target nosuchtarget --yes

      - name: Reject a critical DATA_ROOT
        run: |
          set -eu
          output="$(DATA_ROOT=/etc bash install.sh --mode qqofficial-direct \
            --yes --no-cn --no-game-plugins --dry-run 2>&1 || true)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '解析为系统关键路径' \
            || { echo "missing critical-path rejection" >&2; exit 1; }
          # die 发生在命令替换里时不应再打印无关的容器日志排查提示
          if printf '%s\n' "$output" | grep -q '排查提示'; then
            echo "input validation should not emit the container-log hint" >&2
            exit 1
          fi
          echo "critical DATA_ROOT rejected cleanly"

  nonebot-project:
    name: Official NoneBot project generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Generate and assert both project kinds
        run: bash tests/test-nonebot-official-project.sh
