name: ng

x-common-env: &common-env
  TZ: ${TZ:-Asia/Shanghai}

services:
  gscore:
    image: ${GSCORE_IMAGE:-docker.cnb.cool/gscore-mirror/gsuid_core:latest}
    container_name: ng-gscore
    restart: unless-stopped
    environment:
      <<: *common-env
      PYTHONUNBUFFERED: "1"
      UV_INDEX: ${GSCORE_PYTHON_INDEX:-https://pypi.org/simple/}
      UV_NO_CONFIG: ${UV_NO_CONFIG:-0}
      PLAYWRIGHT_BROWSERS_PATH: ${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}
      PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
      NAG_PLAYWRIGHT_NPMMIRROR_BASE: ${NAG_PLAYWRIGHT_NPMMIRROR_BASE:-}
      http_proxy: ${GSCORE_HTTP_PROXY:-}
      https_proxy: ${GSCORE_HTTPS_PROXY:-}
      no_proxy: ${GSCORE_NO_PROXY:-localhost,127.0.0.1,gscore,napcat,.local,cnb.cool,mirrors.aliyun.com,pypi.tuna.tsinghua.edu.cn,mirrors.volces.com}
    ports:
      - "${BIND_IP:-127.0.0.1}:${GSCORE_PORT:-8765}:8765"
    volumes:
      - ${DATA_ROOT:-/opt/ng-data}/gscore/data:/gsuid_core/data
      - ${DATA_ROOT:-/opt/ng-data}/gscore/plugins:/gsuid_core/gsuid_core/plugins
      - gscore-venv:/venv
      - gscore-playwright:/ms-playwright
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ng-net

  napcat:
    # v4.18.5 is the final release before the official-plugin whitelist and
    # sensitive-word checks introduced in NapCatQQ v4.18.6.
    image: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker:v4.18.5}
    container_name: ng-napcat
    restart: unless-stopped
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
      ACCOUNT: ${NAPCAT_ACCOUNT:-}
    ports:
      - "${BIND_IP:-127.0.0.1}:${NAPCAT_WEBUI_PORT:-6099}:6099"
    volumes:
      - ${DATA_ROOT:-/opt/ng-data}/napcat/config:/app/napcat/config
      - ${DATA_ROOT:-/opt/ng-data}/napcat/plugins:/app/napcat/plugins
      - ${DATA_ROOT:-/opt/ng-data}/napcat/qq:/app/.config/QQ
    depends_on:
      - gscore
    networks:
      - ng-net

  napcat-gscore-adapter-init:
    image: ${ALPINE_IMAGE:-alpine:latest}
    container_name: ng-napcat-gscore-adapter-init
    profiles:
      - init
    environment:
      NAPCAT_GSCORE_ADAPTER_ZIP_URL: ${NAPCAT_GSCORE_ADAPTER_ZIP_URL:-https://github.com/xiowo/napcat-plugin-gscore-adapter/releases/download/v1.3.3/napcat-plugin-gscore-adapter.zip}
      NAPCAT_GSCORE_ADAPTER_SHA256: ${NAPCAT_GSCORE_ADAPTER_SHA256:-1776762d0ed8d16ddb8228b98f599c5fa9d166c4a34df5bb0c8f1e2ddd2387ef}
      GSCORE_WS_TOKEN: ${GSCORE_WS_TOKEN:-}
      NAPCAT_MASTER_QQ: ${NAPCAT_MASTER_QQ:-}
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -eu
        apk add --no-cache curl jq unzip
        target=/plugins/napcat-plugin-gscore-adapter
        archive=/tmp/napcat-plugin-gscore-adapter.zip
        staging="$$(mktemp -d /plugins/.napcat-plugin-gscore-adapter.new.XXXXXX)"
        backup="$${staging}.backup"
        had_target=0
        swapped=0
        config_file=
        plugins_file=
        config_backup=
        plugins_backup=
        had_config=0
        had_plugins=0
        config_prepared=0
        plugins_prepared=0
        cleanup() {
          if [ "$$plugins_prepared" -eq 1 ]; then
            rm -f "$$plugins_file" "$${plugins_file}.tmp"
            if [ "$$had_plugins" -eq 1 ]; then
              mv "$$plugins_backup" "$$plugins_file"
            else
              rm -f "$$plugins_backup"
            fi
          fi
          if [ "$$config_prepared" -eq 1 ]; then
            rm -f "$$config_file" "$${config_file}.tmp"
            if [ "$$had_config" -eq 1 ]; then
              mv "$$config_backup" "$$config_file"
            else
              rm -f "$$config_backup"
            fi
          fi
          if [ "$$swapped" -eq 1 ]; then
            rm -rf "$$target"
            [ "$$had_target" -eq 0 ] || mv "$$backup" "$$target"
          fi
          rm -rf "$$staging" "$$backup"
        }
        trap cleanup EXIT INT TERM
        case "$$NAPCAT_GSCORE_ADAPTER_SHA256" in
          *[!0-9A-Fa-f]*|'')
            echo "NAPCAT_GSCORE_ADAPTER_SHA256 must be a 64-character SHA-256." >&2
            exit 1
            ;;
        esac
        [ "$${#NAPCAT_GSCORE_ADAPTER_SHA256}" -eq 64 ] || {
          echo "NAPCAT_GSCORE_ADAPTER_SHA256 must be a 64-character SHA-256." >&2
          exit 1
        }
        curl -fsSL --retry 3 "$$NAPCAT_GSCORE_ADAPTER_ZIP_URL" -o "$$archive"
        printf '%s  %s\n' "$$NAPCAT_GSCORE_ADAPTER_SHA256" "$$archive" \
          | sha256sum -c -
        unzip -q "$$archive" -d "$$staging"
        [ -n "$$(find "$$staging" -mindepth 1 -maxdepth 1 -print -quit)" ] || {
          echo "Downloaded plugin archive is empty." >&2
          exit 1
        }
        if [ -e "$$target" ]; then
          mv "$$target" "$$backup"
          had_target=1
        fi
        if ! mv "$$staging" "$$target"; then
          [ "$$had_target" -eq 0 ] || mv "$$backup" "$$target"
          exit 1
        fi
        swapped=1

        config_dir=/config/plugins/napcat-plugin-gscore-adapter
        config_file="$$config_dir/config.json"
        plugins_file=/config/plugins.json
        mkdir -p "$$config_dir"
        config_backup="$$(mktemp "$${config_file}.nag-backup.XXXXXX")"
        if [ -e "$$config_file" ]; then
          cp -p "$$config_file" "$$config_backup"
          had_config=1
        fi
        config_prepared=1
        plugins_backup="$$(mktemp "$${plugins_file}.nag-backup.XXXXXX")"
        if [ -e "$$plugins_file" ]; then
          cp -p "$$plugins_file" "$$plugins_backup"
          had_plugins=1
        fi
        plugins_prepared=1
        [ -s "$$config_file" ] || printf '{}\n' >"$$config_file"
        jq \
          --arg url 'ws://gscore:8765' \
          --arg token "$$GSCORE_WS_TOKEN" \
          --arg master "$$NAPCAT_MASTER_QQ" \
          '.gscoreEnable = true | .gscoreUrl = $$url | .gscoreToken = $$token | .masterQQ = $$master' \
          "$$config_file" >"$$config_file.tmp"
        mv "$$config_file.tmp" "$$config_file"

        [ -s "$$plugins_file" ] || printf '{}\n' >"$$plugins_file"
        jq '.["napcat-plugin-gscore-adapter"] = true' \
          "$$plugins_file" >"$$plugins_file.tmp"
        mv "$$plugins_file.tmp" "$$plugins_file"

        chown -R "$$NAPCAT_UID:$$NAPCAT_GID" "$$config_dir" "$$plugins_file" "$$target"
        chmod 600 "$$config_file" "$$plugins_file"
        swapped=0
        config_prepared=0
        plugins_prepared=0
        rm -rf "$$backup"
        rm -f "$$config_backup" "$$plugins_backup" \
          "$${config_file}.tmp" "$${plugins_file}.tmp"
        trap - EXIT INT TERM
        echo "NapCat GScore adapter installed, enabled, and configured for ws://gscore:8765."
    volumes:
      - ${DATA_ROOT:-/opt/ng-data}/napcat/plugins:/plugins
      - ${DATA_ROOT:-/opt/ng-data}/napcat/config:/config
    networks:
      - ng-net

  gscore-xwuid-deps-init:
    image: ${GSCORE_IMAGE:-docker.cnb.cool/gscore-mirror/gsuid_core:latest}
    container_name: ng-gscore-xwuid-deps-init
    profiles:
      - init
    environment:
      <<: *common-env
      GSCORE_XWUID_PYTHON_PACKAGES: ${GSCORE_XWUID_PYTHON_PACKAGES:-playwright opencv-python fonttools pypinyin}
      UV_INDEX: ${GSCORE_PYTHON_INDEX:-https://pypi.org/simple/}
      UV_NO_CONFIG: ${UV_NO_CONFIG:-0}
      PLAYWRIGHT_BROWSERS_PATH: ${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}
      http_proxy: ${GSCORE_HTTP_PROXY:-}
      https_proxy: ${GSCORE_HTTPS_PROXY:-}
      no_proxy: ${GSCORE_NO_PROXY:-localhost,127.0.0.1,gscore,napcat,.local,cnb.cool,mirrors.aliyun.com,pypi.tuna.tsinghua.edu.cn,mirrors.volces.com}
    working_dir: /gsuid_core
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -eu
        if [ ! -x /venv/bin/python ]; then
          echo "Missing /venv/bin/python. Start gscore once first: docker compose up -d gscore"
          exit 1
        fi
        uv pip install --python /venv/bin/python $$GSCORE_XWUID_PYTHON_PACKAGES
        if [ -n "$${NAG_PLAYWRIGHT_NPMMIRROR_BASE:-}" ]; then
          /venv/bin/python /opt/nag/run-playwright-with-mirror.py \
            --mirror-base "$$NAG_PLAYWRIGHT_NPMMIRROR_BASE" -- \
            uv run --python /venv/bin/python playwright install chromium
        elif ! uv run --python /venv/bin/python playwright install chromium; then
          if [ -z "$${PLAYWRIGHT_DOWNLOAD_HOST:-}" ]; then exit 1; fi
          echo "Playwright mirror failed; retrying the official download host."
          unset PLAYWRIGHT_DOWNLOAD_HOST
          uv run --python /venv/bin/python playwright install chromium
        fi
    volumes:
      - ${DATA_ROOT:-/opt/ng-data}/gscore/data:/gsuid_core/data
      - ${DATA_ROOT:-/opt/ng-data}/gscore/plugins:/gsuid_core/gsuid_core/plugins
      - gscore-venv:/venv
      - gscore-playwright:/ms-playwright
      - ../scripts/run-playwright-with-mirror.py:/opt/nag/run-playwright-with-mirror.py:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ng-net

  gscore-plugin-init:
    image: ${ALPINE_GIT_IMAGE:-alpine/git:latest}
    container_name: ng-gscore-plugin-init
    profiles:
      - init
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -eu
        mkdir -p /plugins

        clone_or_update() {
          repo="$$1"
          dir="$$2"
          target="/plugins/$$dir"

          if [ -d "$$target/.git" ]; then
            git -C "$$target" pull --ff-only
          elif [ -e "$$target" ]; then
            echo "Skip $$target: exists but is not a git repo"
          else
            git clone --depth=1 "$$repo" "$$target"
          fi
        }

        clone_or_update ${XUTHERINGWAVESUID_REPO:-https://github.com/Loping151/XutheringWavesUID.git} XutheringWavesUID
        clone_or_update ${ROVERSIGN_REPO:-https://github.com/Loping151/RoverSign.git} RoverSign
        clone_or_update ${SCOREECHO_REPO:-https://github.com/Loping151/ScoreEcho.git} ScoreEcho
    volumes:
      - ${DATA_ROOT:-/opt/ng-data}/gscore/plugins:/plugins
    networks:
      - ng-net

networks:
  ng-net:
    driver: bridge

volumes:
  gscore-venv:
  gscore-playwright:
