name: nag

x-common-env: &common-env
  TZ: ${TZ:-Asia/Shanghai}

services:
  gscore:
    image: ${GSCORE_IMAGE:-docker.cnb.cool/gscore-mirror/gsuid_core:latest}
    container_name: nag-gscore
    restart: unless-stopped
    environment:
      <<: *common-env
      PYTHONUNBUFFERED: "1"
      UV_INDEX: ${GSCORE_PYTHON_INDEX:-https://pypi.org/simple/}
      UV_NO_CONFIG: ${UV_NO_CONFIG:-0}
      PLAYWRIGHT_BROWSERS_PATH: ${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}
      http_proxy: ${GSCORE_HTTP_PROXY:-}
      https_proxy: ${GSCORE_HTTPS_PROXY:-}
      no_proxy: ${GSCORE_NO_PROXY:-localhost,127.0.0.1,gscore,nonebot,botshepherd,napcat,.local,cnb.cool,mirrors.aliyun.com,pypi.tuna.tsinghua.edu.cn,mirrors.volces.com}
    ports:
      - "${BIND_IP:-127.0.0.1}:${GSCORE_PORT:-8765}:8765"
    volumes:
      - ${DATA_ROOT:-/opt/nag-data}/gscore/data:/gsuid_core/data
      - ${DATA_ROOT:-/opt/nag-data}/gscore/plugins:/gsuid_core/gsuid_core/plugins
      - gscore-venv:/venv
      - gscore-playwright:/ms-playwright
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nag-net

  nonebot:
    image: ${NONEBOT_IMAGE:-nag-nonebot:local}
    build:
      context: ./nonebot
    container_name: nag-nonebot
    restart: unless-stopped
    environment:
      <<: *common-env
      HOST: 0.0.0.0
      PORT: "8080"
      DRIVER: "~fastapi+~httpx+~websockets"
      NAPCAT_MASTER_QQ: ${NAPCAT_MASTER_QQ:-}
      ENABLE_NONEBOT_GSCORE_ADAPTER: ${ENABLE_NONEBOT_GSCORE_ADAPTER:-true}
      GSUID_CORE_HOST: gscore
      GSUID_CORE_PORT: "8765"
      GSUID_CORE_BOTID: NoneBot2
      GSUID_CORE_WS_TOKEN: ${GSCORE_WS_TOKEN:?Set GSCORE_WS_TOKEN in .env}
      NONEBOT_PYTHON_INDEX: ${NONEBOT_PYTHON_INDEX:-https://pypi.org/simple/}
      NONEBOT_COMMAND_START: ${NONEBOT_COMMAND_START:-/}
    expose:
      - "8080"
    volumes:
      - ${DATA_ROOT:-/opt/nag-data}/nonebot/data:/app/data
      - ${DATA_ROOT:-/opt/nag-data}/nonebot/plugins:/app/plugins
      - ${DATA_ROOT:-/opt/nag-data}/nonebot/site-packages:/app/site-packages
      - ${DATA_ROOT:-/opt/nag-data}/nonebot/cache:/root/.cache/nonebot2
    depends_on:
      - gscore
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; connection = socket.create_connection(("127.0.0.1", 8080), 3); connection.close()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - nag-net

  napcat:
    image: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker:latest}
    container_name: nag-napcat
    restart: unless-stopped
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
      ACCOUNT: ${NAPCAT_ACCOUNT:-}
    ports:
      - "${BIND_IP:-127.0.0.1}:${NAPCAT_WEBUI_PORT:-6099}:6099"
    volumes:
      - ${DATA_ROOT:-/opt/nag-data}/napcat/config:/app/napcat/config
      - ${DATA_ROOT:-/opt/nag-data}/napcat/plugins:/app/napcat/plugins
      - ${DATA_ROOT:-/opt/nag-data}/napcat/qq:/app/.config/QQ
      - ${DATA_ROOT:-/opt/nag-data}/nonebot/cache:/root/.cache/nonebot2:ro
    networks:
      - nag-net

  nonebot-onebot-init:
    image: python:3.12-slim
    container_name: nag-nonebot-onebot-init
    profiles:
      - init
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
      NAPCAT_ONEBOT_WS_URL: ${NAPCAT_ONEBOT_WS_URL:-ws://nonebot:8080/onebot/v11/ws}
      NAPCAT_ONEBOT_WS_NAME: ${NAPCAT_ONEBOT_WS_NAME:-NoneBot}
      BOTSHEPHERD_ENABLED: ${BOTSHEPHERD_ENABLED:-0}
      BOTSHEPHERD_TARGET_ENDPOINT: ws://nonebot:8080/onebot/v11/ws
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -eu
        python - <<'PY'
        import json
        import os
        from pathlib import Path

        onebot_ws_url = os.environ["NAPCAT_ONEBOT_WS_URL"]
        onebot_ws_name = os.environ["NAPCAT_ONEBOT_WS_NAME"]
        uid = int(os.environ["NAPCAT_UID"])
        gid = int(os.environ["NAPCAT_GID"])

        def load_json(path):
            return json.loads(path.read_text(encoding="utf-8-sig"))

        def write_json(path, value, owner=None):
            path.parent.mkdir(parents=True, exist_ok=True)
            temporary = path.with_name(path.name + ".tmp")
            temporary.write_text(
                json.dumps(value, ensure_ascii=False, indent=2) + "\n",
                encoding="utf-8",
            )
            temporary.chmod(0o600)
            if owner is not None:
                os.chown(temporary, *owner)
            temporary.replace(path)

        napcat_dir = Path("/NapCat/config")
        napcat_paths = sorted(napcat_dir.glob("onebot11*.json"))
        if not napcat_paths:
            napcat_paths = [napcat_dir / "onebot11.json"]
            write_json(
                napcat_paths[0],
                {
                    "network": {
                        "httpServers": [],
                        "httpSseServers": [],
                        "httpClients": [],
                        "websocketServers": [],
                        "websocketClients": [],
                        "plugins": [],
                    }
                },
                (uid, gid),
            )

        known_urls = {
            "ws://astrbot:6199/ws",
            "ws://nonebot:8080/onebot/v11/ws",
            "ws://botshepherd:2537/OneBotv11",
            onebot_ws_url,
        }
        known_names = {"rws", "AstrBot", "NoneBot", "BotShepherd", onebot_ws_name}
        for napcat_path in napcat_paths:
            napcat_config = load_json(napcat_path)
            network = napcat_config.setdefault("network", {})
            clients = network.setdefault("websocketClients", [])
            client = next(
                (
                    item
                    for item in clients
                    if item.get("url") in known_urls
                    or item.get("name") in known_names
                ),
                None,
            )
            if client is None:
                client = {}
                clients.append(client)
            client.update(
                {
                    "enable": True,
                    "name": onebot_ws_name,
                    "url": onebot_ws_url,
                    "reportSelfMessage": False,
                    "messagePostFormat": "array",
                    "token": "",
                    "debug": False,
                    "heartInterval": 30000,
                    "reconnectInterval": 5000,
                }
            )
            write_json(napcat_path, napcat_config, (uid, gid))

        if os.environ["BOTSHEPHERD_ENABLED"] == "1":
            connection_path = Path(
                "/BotShepherd/config/connections/default.json"
            )
            if connection_path.is_file():
                connection = load_json(connection_path)
            else:
                connection = {
                    "name": "NAG OneBot",
                    "description": "Generated by NAG installer",
                    "client_endpoint": "ws://0.0.0.0:2537/OneBotv11",
                    "enabled": True,
                }
            connection["target_endpoints"] = [
                os.environ["BOTSHEPHERD_TARGET_ENDPOINT"]
            ]
            connection["enabled"] = True
            write_json(connection_path, connection, (uid, gid))

        print(
            f"Configured {len(napcat_paths)} NapCat WebSocket client(s) "
            f"for {onebot_ws_url}."
        )
        PY
    volumes:
      - ${DATA_ROOT:-/opt/nag-data}/napcat/config:/NapCat/config
    networks:
      - nag-net

  napcat-gscore-adapter-disable:
    image: alpine:latest
    container_name: nag-napcat-gscore-adapter-disable
    profiles:
      - init
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -eu
        apk add --no-cache jq
        plugins_file=/config/plugins.json
        config_file=/config/plugins/napcat-plugin-gscore-adapter/config.json

        if [ -s "$$plugins_file" ]; then
          jq '.["napcat-plugin-gscore-adapter"] = false' \
            "$$plugins_file" >"$$plugins_file.tmp"
          mv "$$plugins_file.tmp" "$$plugins_file"
        fi
        if [ -s "$$config_file" ]; then
          jq '.gscoreEnable = false' "$$config_file" >"$$config_file.tmp"
          mv "$$config_file.tmp" "$$config_file"
        fi
        [ ! -e "$$plugins_file" ] || chown "$$NAPCAT_UID:$$NAPCAT_GID" "$$plugins_file"
        [ ! -e "$$config_file" ] || chown "$$NAPCAT_UID:$$NAPCAT_GID" "$$config_file"
        echo "NapCat GScore adapter disabled; NoneBot GenshinUID owns GScore."
    volumes:
      - ${DATA_ROOT:-/opt/nag-data}/napcat/config:/config
    networks:
      - nag-net

  gscore-xwuid-deps-init:
    image: ${GSCORE_IMAGE:-docker.cnb.cool/gscore-mirror/gsuid_core:latest}
    container_name: nag-gscore-xwuid-deps-init
    profiles:
      - init
    environment:
      <<: *common-env
      GSCORE_XWUID_PYTHON_PACKAGES: ${GSCORE_XWUID_PYTHON_PACKAGES:-playwright opencv-python fonttools pypinyin}
      UV_INDEX: ${GSCORE_PYTHON_INDEX:-https://pypi.org/simple/}
      UV_NO_CONFIG: ${UV_NO_CONFIG:-0}
      PLAYWRIGHT_BROWSERS_PATH: ${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}
      http_proxy: ${GSCORE_HTTP_PROXY:-}
      https_proxy: ${GSCORE_HTTPS_PROXY:-}
      no_proxy: ${GSCORE_NO_PROXY:-localhost,127.0.0.1,gscore,nonebot,botshepherd,napcat,.local,cnb.cool,mirrors.aliyun.com,pypi.tuna.tsinghua.edu.cn,mirrors.volces.com}
    working_dir: /gsuid_core
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -eu
        if [ ! -x /venv/bin/python ]; then
          echo "Missing /venv/bin/python. Start gscore once first: docker compose up -d gscore"
          exit 1
        fi
        uv pip install --python /venv/bin/python $$GSCORE_XWUID_PYTHON_PACKAGES
        uv run --python /venv/bin/python playwright install chromium
    volumes:
      - ${DATA_ROOT:-/opt/nag-data}/gscore/data:/gsuid_core/data
      - ${DATA_ROOT:-/opt/nag-data}/gscore/plugins:/gsuid_core/gsuid_core/plugins
      - gscore-venv:/venv
      - gscore-playwright:/ms-playwright
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nag-net

  gscore-plugin-init:
    image: alpine/git:latest
    container_name: nag-gscore-plugin-init
    profiles:
      - init
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        set -eu
        mkdir -p /plugins

        clone_or_update() {
          repo="$$1"
          dir="$$2"
          target="/plugins/$$dir"

          if [ -d "$$target/.git" ]; then
            git -C "$$target" pull --ff-only
          elif [ -e "$$target" ]; then
            echo "Skip $$target: exists but is not a git repo"
          else
            git clone --depth=1 "$$repo" "$$target"
          fi
        }

        clone_or_update ${XUTHERINGWAVESUID_REPO:-https://github.com/Loping151/XutheringWavesUID.git} XutheringWavesUID
        clone_or_update ${ROVERSIGN_REPO:-https://github.com/Loping151/RoverSign.git} RoverSign
        clone_or_update ${SCOREECHO_REPO:-https://github.com/Loping151/ScoreEcho.git} ScoreEcho
    volumes:
      - ${DATA_ROOT:-/opt/nag-data}/gscore/plugins:/plugins
    networks:
      - nag-net

networks:
  nag-net:
    driver: bridge

volumes:
  gscore-venv:
  gscore-playwright:
